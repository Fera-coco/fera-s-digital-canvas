    <noscript><h1>Refund & return policy</h1><h2>Refunds</h2><ul><li>All confirmed orders are generally non-refundable once dispatched.</li><li>Refund requests may be considered if you receive a wrong, damaged or defective product.</li><li>Refunds for eligible claims will be processed after verification.</li></ul><h2>Wrong or damaged products</h2><ul><li>Customers must report damaged, defective or incorrect items within 24 hours of delivery.</li><li>Clear pictures or videos must be provided as evidence.</li><li>Where our mistake is confirmed, we will arrange a replacement or appropriate refund.</li></ul><h2>Order cancellation</h2><ul><li>Orders can only be cancelled before dispatch.</li><li>Once an order has been dispatched, cancellation is no longer accepted.</li><li>Any eligible refund will be processed through the original payment method.</li></ul><h2>Delivery fees</h2><ul><li>Delivery fees are generally non-refundable once an order has been dispatched.</li><li>If an error on our part causes the delivery problem, we will review and resolve the issue fairly.</li></ul><h2>Product performance</h2><ul><li>Hair growth and hair care results may vary from person to person.</li><li>A product not producing immediate results does not automatically qualify for a refund.</li><li>Customers are encouraged to follow the recommended usage instructions.</li></ul><h2>International orders</h2><ul><li>International orders are subject to the same product refund conditions.</li><li>Shipping charges, customs duties and other applicable charges may be non-refundable, subject to the circumstances and applicable consumer protection laws.</li></ul></noscript>
